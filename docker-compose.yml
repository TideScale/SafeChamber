services:
  openchamber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openchamber
    userns_mode: keep-id
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/openchamber:/home/openchamber/.config/openchamber:Z
      - ./data/opencode/share:/home/openchamber/.local/share/opencode:Z
      - ./data/opencode/state:/home/openchamber/.local/state/opencode:Z
      - ./data/opencode/config:/home/openchamber/.config/opencode:Z
      - ./data/ssh:/home/openchamber/.ssh:Z
      - ./workspaces:/home/openchamber/workspaces:Z
      # >>> docker access: the host rootless engine, exposed as the docker socket
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:Z
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD before exposing OpenChamber through Docker}
      # >>> docker access: aim the docker CLI at the passed-through socket
      DOCKER_HOST: unix:///var/run/docker.sock
    restart: unless-stopped

